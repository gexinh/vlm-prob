name: Build and publish Python package

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/test_package_imports.py"
      - "tests/test_repository_sync.py"
      - "tools/sync_repositories.py"
      - "examples/tiny_model.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_package_imports.py"
      - "tests/test_repository_sync.py"
      - "tools/sync_repositories.py"
      - "examples/tiny_model.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Build only, or publish with a configured PyPI trusted publisher"
        type: choice
        required: true
        default: none
        options: [none, testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and CPU PyTorch
        run: |
          python -m pip install --upgrade build twine
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build source distribution and wheel
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel
        env:
          PYTHONPATH: examples
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -p test_package_imports.py -v
          python -m unittest discover -s tests -p test_repository_sync.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: vlmprobe-dist-${{ matrix.python }}
          path: dist/*

  publish:
    if: github.repository == 'gexinh/vlm-probing' && github.event_name == 'workflow_dispatch' && inputs.publish_target != 'none'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_target }}
      url: ${{ inputs.publish_target == 'pypi' && 'https://pypi.org/project/vlmprobe/' || 'https://test.pypi.org/project/vlmprobe/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlmprobe-dist-3.12
          path: dist
      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
